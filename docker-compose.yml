services:
  app:
    build:
      context: .
      target: runner
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://ark.cn-beijing.volces.com/api/plan/v3}
      - OPENAI_MODEL=${OPENAI_MODEL:-doubao-seed-evolving}
      - SQLITE_DB_PATH=/app/data/storyforge.sqlite
      - SQLITE_BACKUP_DIR=/app/data/backups
      - STORYFORGE_HOST=127.0.0.1
    volumes:
      - storyforge-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>{process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  storyforge-data:
