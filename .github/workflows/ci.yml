name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  OPENAI_API_KEY: sk-test-mock
  OPENAI_BASE_URL: https://api.deepseek.com
  OPENAI_MODEL: deepseek-v4-flash
  GENERATION_PROVIDER: fake

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify
      - run: npm run authoring:evaluate -- --provider fake
      - run: npm run db:authoring:smoke
      - run: npm run legacy:export -- --dry-run

  e2e-authoring:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:authoring
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authoring-e2e-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  release-evidence:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [verify, e2e-authoring]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:standalone
      - run: npm run release:evidence
      - uses: actions/upload-artifact@v4
        with:
          name: storyforge-release-${{ github.ref_name }}
          path: |
            output/package/StoryForge-*/
            output/release/
          if-no-files-found: error
          retention-days: 30
