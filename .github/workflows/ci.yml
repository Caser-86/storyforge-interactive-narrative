name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  OPENAI_API_KEY: sk-test-mock
  OPENAI_BASE_URL: https://ark.cn-beijing.volces.com/api/plan/v3
  OPENAI_MODEL: doubao-seed-evolving
  GENERATION_PROVIDER: fake

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check PowerShell runtime
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7.x (pwsh) is required." }
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify
      - run: npm run authoring:evaluate -- --provider fake
      - run: npm run interactive:evaluate -- --provider fake
      - run: npm run db:authoring:smoke
      - run: npm run legacy:export -- --dry-run

  e2e-authoring:
    runs-on: ubuntu-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:authoring
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authoring-e2e-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  standalone-windows:
    runs-on: windows-latest
    needs: [verify]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check PowerShell runtime
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw "PowerShell 7.x (pwsh) is required." }
      - run: npm ci
      - run: npm run package:standalone
      - name: Run isolated standalone lifecycle smoke
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "storyforge-package-smoke"
          pwsh -NoProfile -File scripts/package-smoke.ps1 -Mode Local -Root $smokeRoot

  docker-build:
    runs-on: ubuntu-latest
    needs: [verify]
    env:
      STORYFORGE_IMAGE: storyforge-ci:${{ github.sha }}
      STORYFORGE_CONTAINER: storyforge-ci-${{ github.run_id }}
      STORYFORGE_PORT: 3910
    steps:
      - uses: actions/checkout@v4
      - name: Build Linux Docker image
        run: docker build --pull --tag "$STORYFORGE_IMAGE" .
      - name: Smoke the container health endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name "$STORYFORGE_CONTAINER" \
            --publish "127.0.0.1:${STORYFORGE_PORT}:3000" \
            --env GENERATION_PROVIDER=fake \
            --env OPENAI_API_KEY=sk-test-mock \
            --env OPENAI_BASE_URL=https://ark.cn-beijing.volces.com/api/plan/v3 \
            --env OPENAI_MODEL=doubao-seed-evolving \
            --env STORYFORGE_HOST=0.0.0.0 \
            --env STORYFORGE_ALLOW_LAN=true \
            "$STORYFORGE_IMAGE"

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error "http://127.0.0.1:${STORYFORGE_PORT}/api/health"; then
              echo
              exit 0
            fi
            sleep 1
          done

          docker logs "$STORYFORGE_CONTAINER"
          exit 1
      - name: Remove Docker smoke container
        if: always()
        shell: bash
        run: docker rm --force "$STORYFORGE_CONTAINER" || true

  release-evidence:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [verify, e2e-authoring, standalone-windows, docker-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:standalone
      - run: npm run release:evidence
      - uses: actions/upload-artifact@v4
        with:
          name: storyforge-release-${{ github.ref_name }}
          path: |
            output/package/StoryForge-*/
            output/release/
          if-no-files-found: error
          retention-days: 30
